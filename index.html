<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遺産トラベラー">
<meta name="theme-color" content="#1d2a47">
<title>世界遺産トラベラー</title>
<style>
:root{
  --navy:#1d2a47; --navy2:#2b3b60; --gold:#c4a052; --gold2:#e3c98a;
  --paper:#f4ecd9; --paper2:#ebe0c6; --ink:#2d2416; --ink2:#6b5b40; --line:#d5c6a3;
  --red:#b8402f; --blue:#2f5d8a; --green:#3d7a52;
  --bronze:#a8683a; --silver:#8c96a3; --goldc:#c79a2e;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy)}
body{font-family:var(--sans);color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  background:var(--paper) radial-gradient(circle at 20% 10%,rgba(255,255,255,.5),transparent 40%);}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:repeating-linear-gradient(115deg,transparent 0 11px,rgba(160,130,80,.07) 11px 12px),repeating-linear-gradient(65deg,transparent 0 11px,rgba(160,130,80,.07) 11px 12px)}
header.top{position:relative;padding:calc(var(--st) + 10px) 16px 10px;background:var(--navy);color:var(--gold2);display:flex;align-items:center;gap:10px;z-index:2}
header.top h1{margin:0;font-family:var(--serif);font-size:17px;letter-spacing:.12em;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .back{color:var(--gold2);font-size:15px;padding:10px 14px 10px 0;margin:-6px 0;min-height:44px;flex:none}
main{position:relative;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 24px}
nav.tabs{position:relative;display:flex;background:var(--navy);padding:6px 4px calc(var(--sb) + 6px);z-index:2}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#9aa6c2;font-size:10.5px;padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--gold2)}
.h2{font-family:var(--serif);font-size:19px;margin:4px 0 10px;letter-spacing:.06em}
.small{font-size:12.5px;color:var(--ink2)}
.card{position:relative;background:#fbf6ea;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.btn{display:block;width:100%;padding:14px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;text-align:center;margin-top:10px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:transparent;border:1.5px solid var(--navy);color:var(--navy)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--paper2);color:var(--ink2);margin:2px 4px 2px 0}
/* home */
.count{background:var(--navy);color:#fff;border-radius:16px;padding:16px;position:relative;overflow:hidden}
.count .big{font-family:var(--serif);font-size:44px;color:var(--gold2);line-height:1}
.count .lbl{font-size:12px;color:#c2cbe0}
.count::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:2px dashed rgba(227,201,138,.35)}
.bar{height:8px;border-radius:99px;background:var(--paper2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldc))}
.stat3{display:flex;gap:8px}
.stat3>div{flex:1;text-align:center;background:#fbf6ea;border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.stat3 b{display:block;font-family:var(--serif);font-size:22px}
/* regions */
.region{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbf6ea;margin-bottom:10px;width:100%;text-align:left}
.region.lock{opacity:.45}
.region .ic{width:46px;height:46px;border-radius:50%;background:var(--navy);display:grid;place-items:center;color:var(--gold2);flex:none}
.region .nm{font-family:var(--serif);font-size:17px;font-weight:600}
/* map */
.mapwrap{position:relative;background:#e9dcbd;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.land{fill:#f7efdb;stroke:#a88f5f;stroke-width:.7}
.nb{fill:#e2d5b5;stroke:#c2ad80;stroke-width:.5}
.grat{stroke:rgba(140,110,60,.18);stroke-width:.6;fill:none}
.pin{cursor:pointer}
.pin circle.o{fill:#fff;stroke:var(--navy);stroke-width:2}
.legend{display:flex;gap:10px;justify-content:center;font-size:11px;color:var(--ink2);margin:8px 0}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid var(--navy)}
/* site sheet */
.sheet{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet>.in{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:18px 16px calc(var(--sb) + 18px);animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.tcard{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fbf6ea}
.tcard .hd{background:var(--navy);color:#fff;padding:14px;display:flex;gap:12px;align-items:center;position:relative}
.tcard .hd .ic{width:56px;height:56px;border-radius:12px;background:var(--paper);display:grid;place-items:center;flex:none}
.tcard .hd .nm{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3}
.tcard .hd .sub{font-size:12px;color:#c2cbe0;margin-top:3px}
.tcard .bd{padding:14px}
.tcard .catch{font-family:var(--serif);font-size:15px;color:var(--red);margin-bottom:8px}
.tcard ul{margin:0;padding-left:1.1em;line-height:1.7;font-size:14.5px}
.tcard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin:10px 0 0}
.tcard dt{color:var(--ink2)}
.tcard dd{margin:0;font-weight:600}
.rank{position:absolute;right:12px;top:12px;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:700}
.r0{background:#4a5675;color:#cdd5e6}.r1{background:var(--bronze);color:#fff}.r2{background:var(--silver);color:#fff}.r3{background:var(--goldc);color:#fff}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1}
.qnum{font-size:12px;color:var(--ink2);white-space:nowrap}
.qbox{font-size:17px;line-height:1.6;font-weight:600;margin-bottom:14px}
.qtag{font-size:11px;color:#fff;background:var(--blue);padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:8px;font-weight:600}
.qtag.basic{background:var(--green)}
.ch{display:block;width:100%;text-align:left;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:#fffaf0;margin-bottom:9px;font-size:16px;line-height:1.4}
.ch.ok{border-color:var(--green);background:#e4f1e6}
.ch.ng{border-color:var(--red);background:#f8e1dc}
.ch.dim{opacity:.55}
.fb{border-radius:12px;padding:12px 14px;margin-top:6px;font-size:14px;line-height:1.65;animation:up .2s}
.fb.ok{background:#e4f1e6;border:1px solid #b9d8c0}.fb.ng{background:#f8e1dc;border:1px solid #e7b9ae}
.fb b{font-size:15px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--red);font-size:13px}
/* stamps / passport */
.stamp{display:inline-grid;place-items:center;width:96px;height:96px;border-radius:50%;border:3px double currentColor;font-family:var(--serif);text-align:center;font-size:11px;line-height:1.25;transform:rotate(-12deg);font-weight:700}
.stamp b{font-size:15px;display:block}
.stamp.red{color:var(--red)}.stamp.blue{color:var(--blue)}.stamp.green{color:var(--green)}
.stamp.empty{color:#c9b991;border-style:dashed;transform:none;font-weight:400}
.pp-cover{background:var(--navy);border-radius:14px;color:var(--gold2);text-align:center;padding:26px 16px;font-family:var(--serif);box-shadow:inset 0 0 0 6px var(--navy),inset 0 0 0 7px rgba(196,160,82,.5)}
.pp-cover .t1{letter-spacing:.3em;font-size:13px}.pp-cover .t2{font-size:22px;letter-spacing:.15em;margin:6px 0}
.pp-page{background:#fbf6ea;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;
  background-image:repeating-radial-gradient(circle at 50% 50%,transparent 0 9px,rgba(47,93,138,.05) 9px 10px)}
.stampgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center;margin-top:8px}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(15,20,35,.6);display:grid;place-items:center;animation:fade .2s;padding:20px}
.overlay .box{background:var(--paper);border-radius:20px;padding:24px 18px;text-align:center;width:100%;max-width:360px}
.slam{animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes slam{0%{transform:scale(2.6) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-12deg)}}
/* collection */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.mini{border-radius:12px;border:1px solid var(--line);background:#fbf6ea;padding:10px 6px 8px;text-align:center;position:relative}
.mini .ic{width:48px;height:48px;margin:0 auto 4px;border-radius:50%;display:grid;place-items:center;background:var(--paper2)}
.mini .nm{font-size:11.5px;font-weight:700;line-height:1.3;min-height:2.6em}
.mini.r0{opacity:.55;filter:grayscale(1)}
.mini .rb{position:absolute;top:5px;right:5px;width:12px;height:12px;border-radius:50%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:#fbf6ea;font-size:13px}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lcard{min-height:240px;display:flex;flex-direction:column}
.lcard .t{font-family:var(--serif);font-size:20px;margin-bottom:10px;color:var(--navy)}
.lcard .b{font-size:15.5px;line-height:1.8;flex:1}
input[type=date],input[type=text]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;width:100%}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 80px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;animation:fade .2s}
.center{text-align:center}
.score{font-family:var(--serif);font-size:56px;line-height:1;color:var(--navy)}
table.res{width:100%;border-collapse:collapse;font-size:13.5px}
table.res td{padding:6px 4px;border-bottom:1px dashed var(--line)}
table.res td:last-child{text-align:right;font-weight:700}

.mapwrap.zoom{overflow:auto;max-height:62vh;-webkit-overflow-scrolling:touch}
.mapwrap.zoom svg{width:260%;max-width:none}
.zbtn{position:absolute;right:8px;bottom:8px;background:var(--navy);color:#fff;padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.slist{margin-top:6px;border-top:1px solid var(--line)}
.srow{display:flex;gap:10px;align-items:center;width:100%;padding:10px 4px;border-bottom:1px dashed var(--line)}
.srow b{font-size:14.5px}
.sic{width:38px;height:38px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;flex:none}
.pill.danger{background:var(--red);color:#fff}
.stamp{width:88px;height:88px}
.yomi{position:relative;text-decoration:underline dotted rgba(29,42,71,.55);text-underline-offset:3px;cursor:pointer}
.yomi.on::after{content:attr(data-r);position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);white-space:nowrap;background:var(--navy);color:#fff;font-size:11px;font-weight:700;line-height:1.3;padding:2px 7px;border-radius:6px;z-index:5;pointer-events:none}
.more{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.more .mh{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:2px}
#main.showyomi .yomi::after{content:attr(data-r);position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);white-space:nowrap;background:var(--navy);color:#fff;font-size:10px;font-weight:700;line-height:1.3;padding:1px 6px;border-radius:6px;z-index:5;pointer-events:none}
#main.showyomi .ch{padding-top:20px}
#main.showyomi .qbox{margin-top:14px}
.ybtn{flex:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1.5px solid var(--navy);color:var(--navy)}
.ybtn.on{background:var(--navy);color:#fff}
table.crit{width:100%;border-collapse:collapse;font-size:14px}
table.crit td{padding:7px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
table.crit td.no{font-family:var(--serif);font-weight:700;color:var(--navy);white-space:nowrap;width:3.2em}
table.crit td.grp{background:var(--navy);color:var(--gold2);font-weight:700;font-size:12px;border-radius:6px}
table.crit td.grp.nat{background:var(--green);color:#fff}
table.crit td:last-child{width:34%}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="hdr"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<script>
// ===== 学習データ（サンプル版：本部＋日本6件） =====
const BASIC_CARDS = [
  {t:"世界遺産条約", b:"1972年、ユネスコ総会で採択された条約。正式名は「世界の文化遺産及び自然遺産の保護に関する条約」。人類みんなの宝を、国をこえて守ることが目的。日本は1992年に締結した。"},
  {t:"きっかけはヌビア遺跡", b:"1960年代、エジプトのアスワン・ハイ・ダム建設で、アブ・シンベル神殿などのヌビア遺跡が水没しそうになった。ユネスコが世界に呼びかけて神殿を移築し、救ったことが条約づくりのきっかけになった。"},
  {t:"3つの種類", b:"世界遺産には「文化遺産」「自然遺産」、その両方の価値をもつ「複合遺産」がある。"},
  {t:"顕著な普遍的価値", b:"国や時代をこえて、人類全体にとって大切な価値のこと。登録には、①登録基準を1つ以上満たす ②文化遺産は「真正性」（本物であること）、すべての遺産は「完全性」（価値を示す要素がそろっていること）③国内法などで守られていること、が必要。"},
  {t:"登録基準 (i)〜(vi)", b:"文化遺産の基準。(i) 人類の創造的才能を示す傑作／(ii) 文化の交流を示す／(iii) 文化や文明の証拠／(iv) 歴史の重要な段階を示す建築や景観／(v) 伝統的な集落や土地利用／(vi) 出来事・信仰・芸術などと強く結びつく。"},
  {t:"登録基準 (vii)〜(x)", b:"自然遺産の基準。(vii) すぐれた自然美／(viii) 地球の歴史の重要な段階／(ix) 生態系の進化や発展の過程／(x) 生物多様性と絶滅のおそれがある種のすみか。"},
  {t:"登録までの流れ", b:"各国がまず「暫定リスト」をつくる → 推薦書をユネスコ世界遺産センターに出す → 諮問機関が調査（文化遺産はICOMOS、自然遺産はIUCN）→ 年1回の世界遺産委員会（21か国）が決める。結果は「登録・情報照会・登録延期・不登録」の4段階。"},
  {t:"最初の世界遺産", b:"1978年、最初の12件が登録された。エクアドルの『ガラパゴス諸島』、セネガルの『ゴレ島』、ポーランドの『ヴィエリチカとボフニャの王立岩塩坑』などがある。"},
  {t:"危機遺産", b:"紛争・災害・開発などで価値が失われそうな遺産は「危機遺産リスト」に記載される。最初は1979年、地震の被害を受けたモンテネグロの『コトルの文化歴史地域と自然』。価値が失われると削除されることもある（2007年アラビアオリックスの保護地区、2009年ドレスデン・エルベ渓谷、2021年リヴァプール海商都市）。"},
  {t:"いろいろな言葉", b:"バッファー・ゾーン：遺産のまわりの開発を制限する緩衝地帯。トランスバウンダリー・サイト：国境をこえて広がる遺産。シリアル・サイト：離れた場所にある複数の資産をまとめて1つにした遺産。グローバル・ストラテジー：1994年に採択された、リストのかたよりを直すための方針。"},
  {t:"文化的景観", b:"1992年に取り入れられた考え方で、人間が自然とともにつくり上げた景観のこと。文化遺産に分類される。1993年、ニュージーランドの『トンガリロ国立公園』に初めて適用された。「意匠された景観」「有機的に進化する景観」「関連する景観」の3つのカテゴリーがある。"},
  {t:"記憶の場", b:"2023年に取り入れられた考え方で、戦争や虐殺など、国や人々が記憶に残したいと考える出来事が起こった場所のこと。『第一次世界大戦（西部戦線）の慰霊と記憶の場』や『ルワンダ虐殺の記憶の場』などが登録されている。"},
  {t:"ユネスコのほかの遺産", b:"「無形文化遺産」は2003年の無形文化遺産条約にもとづき、芸能や祭り、技術などを守る（日本の「能楽」「歌舞伎」「和食」など）。「世界の記憶」は1992年に始まり、書物や記録を守る（日本の「山本作兵衛コレクション」など）。"}
];

const BASIC_Q = [
  {id:"b1", q:"世界遺産条約がユネスコ総会で採択された年は？", c:["1972年","1945年","1978年","1992年"], e:"1972年に採択。1945年はユネスコ憲章が採択された年、1978年は最初の世界遺産が登録された年、1992年は日本が締結した年。"},
  {id:"b2", q:"日本が世界遺産条約を締結した年は？", c:["1992年","1972年","1978年","1993年"], e:"日本の締結は1992年。翌1993年に日本で最初の世界遺産4件が登録された。"},
  {id:"b3", q:"世界遺産条約がつくられるきっかけになった、ダムの建設で水没しそうになった遺跡は？", c:["ヌビア遺跡","ヴェネツィア","ボロブドゥール","モヘンジョ・ダロ"], e:"アスワン・ハイ・ダムの建設で水没の危機にあったアブ・シンベル神殿などのヌビア遺跡を、ユネスコの国際キャンペーンで移築して救った。"},
  {id:"b4", q:"自然遺産の登録基準はどれ？", c:["(vii)〜(x)","(i)〜(iv)","(i)〜(vi)","(v)〜(x)"], e:"(i)〜(vi)が文化遺産、(vii)〜(x)が自然遺産の基準。"},
  {id:"b5", q:"登録基準 (viii) が示す価値は？", c:["地球の歴史の重要な段階","生物多様性","すぐれた自然美","人類の創造的才能の傑作"], e:"(viii)は地層や地形など地球の歴史。自然美は(vii)、生物多様性は(x)、創造的才能の傑作は(i)。"},

  {id:"c10", q:"1964年に採択され、「真正性」の考え方を示した憲章は？", c:["ヴェネツィア憲章","アテネ憲章","ユネスコ憲章","ハーグ条約"], e:"ヴェネツィア憲章。修復では建設当時の工法や素材を尊重すべきとした。"},
  {id:"c11", q:"武力紛争のときに文化財を守るため、1954年に採択された条約は？", c:["ハーグ条約","ラムサール条約","ワシントン条約","世界遺産条約"], e:"ハーグ条約（武力紛争の際の文化財の保護に関する条約）。"},
  {id:"c12", q:"ヴェネツィア憲章の考え方にもとづき、1965年に設立された機関は？", c:["ICOMOS","IUCN","ICCROM","世界遺産センター"], e:"ICOMOS（国際記念物遺跡会議）。本部はパリ。"},
  {id:"c13", q:"IUCN（国際自然保護連合）が設立された年は？", c:["1948年","1965年","1959年","1972年"], e:"1948年。本部はスイスのグラン。"},
  {id:"c14", q:"ICCROM（文化財の保存及び修復の研究のための国際センター）の本部がある都市は？", c:["ローマ","パリ","グラン","ロンドン"], e:"イタリアのローマ。1959年に設立された。"},
  {id:"c15", q:"世界遺産の考え方につながる「手つかずの自然」を意味する言葉は？", c:["ウィルダネス","ランドスケープ","バッファー・ゾーン","エコツーリズム"], e:"ウィルダネス。1872年、世界最初の国立公園イエローストーンで重視された。"},
  {id:"c16", q:"文化遺産保護と自然保護の流れがまとめられた、1972年の国際会議は？", c:["国連人間環境会議（ストックホルム）","第1回世界遺産委員会","ユネスコ総会（パリ）","リオ・サミット"], e:"ストックホルムの国連人間環境会議でまとめられ、同年11月のユネスコ総会で世界遺産条約が採択された。"},
  {id:"c17", q:"ヌビア遺跡群の救済を依頼したエジプトの大統領は？", c:["ナセル","サダト","ムバラク","ナギーブ"], e:"アスワン・ハイ・ダムの建設を進めたナセル大統領がユネスコに救済を依頼した。"},
  {id:"c18", q:"ヌビア遺跡群の救済キャンペーンには、約何か国が協力した？", c:["約50か国","約10か国","約120か国","約200か国"], e:"約50か国の協力で「人類共通の遺産」という理念が生まれた。"},
  {id:"c19", q:"ユネスコが1966年に救済キャンペーンを行った、地盤の悪化で水没しつつある都市は？", c:["ヴェネツィア","アムステルダム","バンコク","ドゥブロヴニク"], e:"ヴェネツィア。1968年からはボロブドゥールの救済キャンペーンも行われた。"},
  {id:"c20", q:"世界遺産登録の前提条件として正しくないものは？", c:["ユネスコの加盟国であること","世界遺産条約の締約国であること","暫定リストに記載されていること","不動産であること"], e:"ユネスコ加盟国である必要はない（ユネスコを脱退中のアメリカから登録されたこともある）。"},
  {id:"c21", q:"遺産保有国以外が申請した唯一の例外は？", c:["エルサレムの旧市街とその城壁群","アウシュヴィッツ・ビルケナウ","ヌビアの遺跡群","ゴレ島"], e:"ヨルダンが申請した『エルサレムの旧市街とその城壁群』だけ。"},
  {id:"c22", q:"世界遺産に登録できるのは？", c:["土地や建物などの不動産","絵画や彫刻","古文書","祭りや芸能"], e:"不動産だけ。祭りなどは無形文化遺産、古文書は「世界の記憶」の対象。"},
  {id:"c23", q:"「価値を示す要素がすべてそろい、守るための体制が整っていること」を何という？", c:["完全性","真正性","普遍性","代表性"], e:"完全性。真正性は「本物であること」。"},
  {id:"c24", q:"文化遺産と自然遺産の登録基準が(i)〜(x)の共通の基準にまとめられた年は？", c:["2005年","1972年","1994年","2015年"], e:"2005年、作業指針の改定で共通の10項目になった。"},
  {id:"c25", q:"登録基準が定められている文書は？", c:["世界遺産条約履行のための作業指針","ユネスコ憲章","ヴェネツィア憲章","世界遺産条約の前文"], e:"「世界遺産条約履行のための作業指針」。"},
  {id:"c26", q:"登録基準(i)〜(vi)のすべてが認められている遺産は？", c:["ヴェネツィアとその潟","ローマの歴史地区","アテネのアクロポリス","古都京都の文化財"], e:"『ヴェネツィアとその潟』は(i)〜(vi)すべてで登録されている。"},
  {id:"c27", q:"推薦書を出す前に諮問機関の事前評価を受ける制度は？", c:["プレリミナリー・アセスメント","アップストリーム・プロセス","グローバル・ストラテジー","情報照会"], e:"プレリミナリー・アセスメント。2021年に導入が決まり、必須の手続きになった。"},
  {id:"c28", q:"プレリミナリー・アセスメントの申請から登録まで、最短でおよそ何年かかる？", c:["約4年","約1年","約10年","約6か月"], e:"申請書提出から世界遺産委員会での審議まで約4年。"},
  {id:"c29", q:"新しい事前評価の手続きで登録をめざす日本初の遺産は？", c:["彦根城","飛鳥・藤原の宮都","佐渡島の金山","金峯山寺"], e:"彦根城。2023年9月に事前評価の申請書を出した。"},
  {id:"c30", q:"アップストリーム・プロセスを活用して登録された初めての世界遺産は？", c:["ナミブ砂漠","ガラパゴス諸島","グレート・バリア・リーフ","イエローストーン国立公園"], e:"2013年登録の『ナミブ砂漠』。アップストリーム・プロセスは必須ではない任意の手続き。"},
  {id:"c31", q:"世界遺産委員会の決議の4段階に入らないものは？", c:["条件付き登録","登録","情報照会","登録延期"], e:"「登録」「情報照会」「登録延期」「不登録」の4段階。"},
  {id:"c32", q:"推薦書を受け取り、諮問機関に調査を依頼するのは？", c:["世界遺産センター","世界遺産委員会","締約国会議","ICCROM"], e:"世界遺産センター。1992年にパリのユネスコ本部内に設立された。"},
  {id:"c33", q:"複合遺産の調査を行うのは？", c:["ICOMOSとIUCNの両方","ICOMOSだけ","IUCNだけ","ICCROM"], e:"複合遺産は両方がそれぞれ調査し、評価報告書を出す。"},
  {id:"c34", q:"世界遺産委員会の委員国の任期は？", c:["6年","2年","4年","10年"], e:"任期は6年だが、自発的に4年で終えることが求められている。"},
  {id:"c35", q:"世界遺産基金への分担金・委員国の選定などを行う、全締約国による会議は？", c:["世界遺産条約締約国会議","世界遺産委員会","ユネスコ執行委員会","国連総会"], e:"世界遺産条約締約国会議。"},
  {id:"c36", q:"世界遺産基金への締約国の分担金は、ユネスコ分担金の何％？", c:["1％","5％","10％","0.1％"], e:"ユネスコ分担金の1％。寄付金なども財源になる。"},
  {id:"c37", q:"世界遺産基金の援助に入らないものは？", c:["観光宣伝援助","緊急援助","準備援助","保全・管理援助"], e:"「緊急援助」「準備援助」「保全・管理援助」など。"},
  {id:"c38", q:"日本は世界遺産条約の何番目の締約国？", c:["125番目","1番目","50番目","180番目"], e:"1992年、125番目の締約国になった。"},

  {id:"c41", q:"『明治日本の産業革命遺産』のように稼働中の産業遺産を含む推薦候補を決めるのは？", c:["内閣官房","文化庁","環境省","経済産業省"], e:"2013年から内閣官房が担当している。"},

  {id:"c47", q:"『第一次世界大戦（西部戦線）の慰霊と記憶の場』の推薦国は？", c:["フランスとベルギー","フランスとドイツ","イギリスとフランス","ベルギーとオランダ"], e:"2018年にフランスとベルギーが推薦し、2023年に登録された。"},

  {id:"c49", q:"ユネスコを2018年末に脱退し、2023年に復帰した国は？", c:["アメリカ","イギリス","イスラエル","中国"], e:"アメリカ。世界遺産基金の資金不足の一因にもなった。"},
  {id:"c50", q:"2025年3月時点の世界遺産の数は？", c:["1,223件","1,000件","952件","1,500件"], e:"1,223件（文化遺産952件、自然遺産231件、複合遺産40件）。"},
  {id:"c51", q:"1992年に採択された考え方は？", c:["文化的景観","グローバル・ストラテジー","記憶の場","プレリミナリー・アセスメント"], e:"1992年に文化的景観、1994年にグローバル・ストラテジー、2023年に記憶の場。"},

const $ = (s,el=document)=>el.querySelector(s);
function h(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysLeft(){const t=new Date(today()+"T00:00:00"), e=new Date((S.examDate||EXAM_DEFAULT)+"T00:00:00");return Math.round((e-t)/86400000);}
function toast(m){const t=h(`<div class="toast">${esc(m)}</div>`);document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}
function ask(msg,yes,yesLabel="はい"){
  const ov=h(`<div class="overlay"><div class="box"><div style="font-weight:700;font-size:16px;line-height:1.6">${esc(msg)}</div><div class="row" style="margin-top:14px"><button class="btn ghost">いいえ</button><button class="btn">${esc(yesLabel)}</button></div></div></div>`);
  const [no,ok]=ov.querySelectorAll("button");
  no.onclick=()=>ov.remove(); ok.onclick=()=>{ov.remove();yes();};
  document.body.appendChild(ov);
}
function card(id){return S.cards[id]||{rank:0};}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function pickN(arr,n,rnd){const a=arr.slice();const out=[];while(a.length&&out.length<n){out.push(a.splice(Math.floor(rnd()*a.length),1)[0]);}return out;}

// 効果音
let AC;
function beep(kind){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain(); o.connect(g); g.connect(AC.destination);
    const n=AC.currentTime;
    if(kind==="ok"){o.type="triangle";o.frequency.setValueAtTime(660,n);o.frequency.setValueAtTime(990,n+.08);g.gain.setValueAtTime(.18,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start(n);o.stop(n+.3);}
    else if(kind==="ng"){o.type="sine";o.frequency.setValueAtTime(220,n);o.frequency.linearRampToValueAtTime(160,n+.2);g.gain.setValueAtTime(.2,n);g.gain.exponentialRampToValueAtTime(.001,n+.28);o.start(n);o.stop(n+.28);}
    else {o.type="square";o.frequency.setValueAtTime(90,n);o.frequency.exponentialRampToValueAtTime(40,n+.15);g.gain.setValueAtTime(.35,n);g.gain.exponentialRampToValueAtTime(.001,n+.2);o.start(n);o.stop(n+.2);}
  }catch(e){}
}

const QMAP = {};
BASIC_Q.push(...BASIC_Q2);
BASIC_CARDS.push(...BASIC_CARDS2);
BASIC_Q.forEach(q=>QMAP[q.id]=Object.assign({cat:"basic"},q));
function siteQuestions(s){ return (s._qs = s._qs || buildSiteQs(s)); }
function buildSiteQs(s){
  const cat=siteCat(s), list=[];
  s.qs.forEach(q=>list.push(Object.assign({cat,site:s.id},q)));
  (typeof JP_EXTRA!=="undefined" && JP_EXTRA[s.id]||[]).forEach((x,i)=>list.push({id:s.id+"_x"+i,cat,site:s.id,q:x[0],c:x.slice(1,5),e:x[5]}));
  if(OLD_IDS.has(s.id)) return list;
  const rnd=seeded(s.id), same=regionSites(s.region).filter(x=>x.id!==s.id);
  const pool = same.length>=3 ? same : SITES.filter(x=>x.id!==s.id);
  const asked=s.qs.map(q=>q.q).join(" ");
  // 説明 → 遺産名
  list.push({id:s.id+"_d",cat,site:s.id,q:`「${s.catch}」といえば？`,c:[s.name].concat(pickN(pool,3,rnd).map(x=>x.name)),e:`『${s.name}』（${place(s)}）。${s.pts[0]}`});
  // 国名
  if(s.region!=="jp" && !s.multi && !/国は？/.test(asked)){
    const others=[...new Set(SITES.filter(x=>x.region===s.region&&x.country&&!x.multi&&x.country!==s.country).map(x=>x.country))];
    if(others.length>=3) list.push({id:s.id+"_c",cat,site:s.id,q:`『${s.name}』がある国は？`,c:[s.country].concat(pickN(others,3,rnd)),e:`${s.country}にある。`});
  }
  // 登録基準（日本）
  if(s.region==="jp" && s.crit && !/登録基準/.test(asked)){
    const others=[...new Set(SITES.filter(x=>x.region==="jp"&&x.crit&&x.crit!==s.crit).map(x=>x.crit))];
    list.push({id:s.id+"_r",cat,site:s.id,q:`『${s.name}』の登録基準は？`,c:[s.crit].concat(pickN(others,3,rnd)),e:`登録基準は${s.crit}。`});
  }
  // 遺産の種類（自然・複合のみ）
  if(s.region!=="jp" && s.kind!=="文化遺産"){
    list.push({id:s.id+"_k",cat,site:s.id,q:`『${s.name}』はどの種類の世界遺産？`,c:[s.kind].concat(["文化遺産","自然遺産","複合遺産"].filter(k=>k!==s.kind)),e:`${s.kind}として登録されている。`});
  }
  // 登録年
  const yrs=[...new Set(SITES.map(x=>x.year).filter(y=>y!==s.year&&Math.abs(y-s.year)<=12))];
  list.push({id:s.id+"_y",rare:true,cat,site:s.id,q:`『${s.name}』が世界遺産に登録された年は？`,c:[s.year+"年"].concat(pickN(yrs,3,rnd).map(y=>y+"年")),e:`${s.year}年に登録された。`});
  return list;
}
function mapQ(s){return {id:"map_"+s.id, type:"map", cat:siteCat(s), site:s.id, q:`『${s.short}』はどこ？ 地図をタップしよう`, e:`${s.short}は${place(s)}にある。`};}

// ---------- 地図 ----------
function project(area,lon,lat){
  const M=MAPS[area], r=Math.PI/180;
  let l=lon+M.rot; while(l<-180)l+=360; while(l>180)l-=360;
  return [M.scale*l*r+M.tr[0], M.tr[1]-M.scale*Math.log(Math.tan(Math.PI/4+lat*r/2))];
}
function labelSvg(t,x,y,side,W,k=1){
  side = side || (x>W*0.7?"l":"r");
  const d=9/k, p={r:[x+d,y+4/k,"start"],l:[x-d,y+4/k,"end"],t:[x,y-10/k,"middle"],b:[x,y+17/k,"middle"]}[side];
  return `<text x="${p[0]}" y="${p[1]}" text-anchor="${p[2]}" font-size="${9.5/k}" font-weight="700" fill="#1d2a47" stroke="#f7efdb" stroke-width="${2.6/k}" paint-order="stroke" pointer-events="none">${esc(t)}</text>`;
}
function regionSVG(area,opts={}){
  const {pins=[], onPin, onTap, labels=false, k=1} = opts, M=MAPS[area];
  let pinsSvg="";
  pins.forEach(s=>{
    const [x,y]=project(area,s.lon,s.lat), o=(area==="jp"&&k===1&&s.off)||[0,0], off=o, px=x+off[0], py=y+off[1];
    const r=card(s.id).rank;
    pinsSvg += `<g class="pin" data-id="${s.id}">
      ${off[0]||off[1]?`<line x1="${x}" y1="${y}" x2="${px}" y2="${py}" stroke="#1d2a47" stroke-width="1"/><circle cx="${x}" cy="${y}" r="1.8" fill="#1d2a47"/>`:""}
      <circle cx="${px}" cy="${py}" r="${11/k}" fill="transparent"/>
      <circle cx="${px}" cy="${py}" r="${6/k}" fill="${RANK_HEX[r]}" stroke="#1d2a47" stroke-width="${1.8/k}"/>
      ${r===3?`<text x="${px}" y="${py+2.8/k}" text-anchor="middle" font-size="${7/k}" fill="#fff" pointer-events="none">★</text>`:""}
      ${labels?labelSvg(s.short,px,py,k===1?s.lab:null,M.W,k):""}
    </g>`;
  });
  const svg = h(`<svg viewBox="0 0 ${M.W} ${M.H}" xmlns="http://www.w3.org/2000/svg">
    <rect width="${M.W}" height="${M.H}" fill="#dfe8ea"/>
    <path class="land" d="${M.land}"/>
    <g class="marks"></g>
    ${pinsSvg}
    <g transform="translate(${M.W-26},26)" stroke="#8a7346" fill="none" stroke-width="1.1"><circle r="15"/><path d="M0-13L3 0 0 13-3 0Z" fill="#c4a052"/><text y="-18" text-anchor="middle" font-size="8" fill="#8a7346" stroke="none">N</text></g>
  </svg>`);
  if(onPin) svg.querySelectorAll(".pin").forEach(g=>g.addEventListener("click",e=>{e.stopPropagation();onPin(g.dataset.id);}));
  if(onTap) svg.addEventListener("click",e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse()); onTap(p.x,p.y,svg);
  });
  return svg;
}

function nextReview(){
  const pool=BASIC_Q.map(q=>q.id).concat(CRIT_Q.map(q=>q.id));
  let bag=(S.reviewBag||[]).filter(id=>QMAP[id]);
  if(!bag.length){ bag=shuffle(pool); }
  const id=bag.shift(); S.reviewBag=bag; save();
  return QMAP[id];
}
function SiteQuiz(id){
  const s=siteById(id);
  const items=shuffle(siteQuestions(s).filter(q=>!q.rare||Math.random()<0.3));
  items.splice(1+Math.floor(Math.random()*items.length),0,QMAP["map_"+id]);
  items.push(Object.assign({mixed:true},nextReview()));
  runQuiz({title:s.short, items, back:()=>AreaMap(s.region), onDone:(r)=>{
    const siteItems=r.answers.filter(a=>!a.q.mixed), ok=siteItems.filter(a=>a.ok).length;
    if(ok/siteItems.length>=0.8) return rankUp(id);
    return {fail:true};
  }});
}
function rankUp(id){
  const c=Object.assign({rank:0},S.cards[id]);
  if(c.rank>=3) return {msg:"金カードの復習完了！"};
  if(c.rank>0 && c.last===today()) return {msg:"クリア！ ランクアップは明日以降にもう一度。"};
  c.rank++; c.last=today(); S.cards[id]=c;
  S.log[today()]=(S.log[today()]||0)+1;
  let stamp=null; const a=siteById(id).region;
  if(!S.stamps[a] && areaDone(a)){S.stamps[a]=today();stamp=a;}
  save();
  return {rank:c.rank, site:id, stamp};
}

// ===== クイズエンジン =====
function runQuiz({title, items, back, onDone, timeLimit, mock}){
  let i=0; const answers=[]; let timerId=null, endAt=timeLimit?Date.now()+timeLimit*1000:null, finished=false;
  const finish=()=>{ if(finished) return; finished=true; clearInterval(timerId);
    const correct=answers.filter(a=>a.ok).length, r={answers, correct, total:items.length};
    const extra=onDone?onDone(r):null; Result(title,r,extra,back,mock); };
  if(endAt) timerId=setInterval(()=>{const t=$("#qtimer"); const left=Math.max(0,Math.round((endAt-Date.now())/1000)); if(t) t.textContent=`残り ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`; if(left<=0){toast("時間切れ！");finish();}},500);
  const show=()=>{
    if(i>=items.length) return finish();
    const q=items[i];
    const m=screen(title,()=>ask("クイズを中断してもどる？",()=>{finished=true;clearInterval(timerId);back();},"もどる"),false);
    m.appendChild(h(`<div class="qtop"><span class="qnum">${i+1} / ${items.length}</span><div class="bar"><i style="width:${i/items.length*100}%"></i></div>${endAt?`<span class="timer" id="qtimer"></span>`:""}</div>`));
    const tagTxt = q.mixed?"基礎知識のおさらい":(q.type==="map"?"地図問題":(CAT_NAME[q.cat]||""));
    m.appendChild(h(`<span class="qtag ${q.cat==="basic"?"basic":""}">${tagTxt}</span>`));
    m.appendChild(h(`<div class="qbox">${ty(q.q)}</div>`));
    setTimeout(()=>{ if(m.querySelector(".yomi")){ const yb=h(`<button class="ybtn">よみがな</button>`); yb.onclick=()=>{m.classList.toggle("showyomi");yb.classList.toggle("on");}; m.querySelector(".qtop").appendChild(yb);} },0);
    const next=()=>{i++;show();};
    if(q.type==="map") mapQuestion(m,q,ok=>record(q,ok),next);
    else mcQuestion(m,q,ok=>record(q,ok),next,mock);
  };
  function record(q,ok){
    answers.push({q,ok});
    if(!ok){S.weak[q.id]={streak:0};}
    else if(S.weak[q.id]){S.weak[q.id].streak++; if(S.weak[q.id].streak>=3){delete S.weak[q.id]; toast("苦手を1問卒業！");}}
    save();
  }
  show();
}
function mcQuestion(m,q,rec,next,mock){
  const order=shuffle(q.c.map((_,k)=>k));
  const btns=order.map(k=>{const b=h(`<button class="ch">${ty(q.c[k])}</button>`); b.dataset.k=k; m.appendChild(b); return b;});
  btns.forEach(b=>b.onclick=()=>{
    if(m.dataset.done) return; m.dataset.done=1;
    const ok=+b.dataset.k===0; rec(ok); beep(ok?"ok":"ng");
    if(mock){ next(); return; }
    btns.forEach(x=>{ if(+x.dataset.k===0) x.classList.add("ok"); else if(x===b) x.classList.add("ng"); else x.classList.add("dim"); });
    m.appendChild(h(`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"せいかい！":"ざんねん…"}</b> 答え：${ty(q.c[0])}<br>${ty(q.e)}</div>`));
    const n=h(`<button class="btn">次へ</button>`); n.onclick=next; m.appendChild(n);
    n.scrollIntoView({behavior:"smooth",block:"end"});
  });
}
function mapQuestion(m,q,rec,next){
  const s=siteById(q.site), area=s.region, [tx,tyy]=project(area,s.lon,s.lat), TOL=28;
  const wrap=h(`<div class="mapwrap"></div>`);
  const svg=regionSVG(area,{onTap:(x,y)=>{
    if(m.dataset.done) return; m.dataset.done=1;
    const ok=Math.hypot(x-tx,y-tyy)<=TOL; rec(ok); beep(ok?"ok":"ng");
    svg.querySelector(".marks").innerHTML=`<circle cx="${tx}" cy="${tyy}" r="${TOL}" fill="rgba(61,122,82,.18)" stroke="#3d7a52" stroke-dasharray="3 3"/>
      <line x1="${x}" y1="${y}" x2="${tx}" y2="${tyy}" stroke="${ok?"#3d7a52":"#b8402f"}" stroke-width="1.5"/>
      <circle cx="${x}" cy="${y}" r="4.5" fill="${ok?"#3d7a52":"#b8402f"}"/>
      <circle cx="${tx}" cy="${tyy}" r="6" fill="#c4a052" stroke="#1d2a47" stroke-width="2"/>
      ${labelSvg(s.short,tx,tyy,"t",MAPS[area].W)}`;
    m.appendChild(h(`<div class="fb ${ok?"ok":"ng"}"><b>${ok?"せいかい！":"おしい！"}</b> ${ty(q.e)}</div>`));
    const n=h(`<button class="btn">次へ</button>`); n.onclick=next; m.appendChild(n);
    n.scrollIntoView({behavior:"smooth",block:"end"});
  }});
  wrap.appendChild(svg); m.appendChild(wrap);
  m.appendChild(h(`<p class="small center">${esc(AREA_NAME[area])}の地図</p>`));
}

function mockPool(){
  const pool={basic:[],jp:[],nature:[],culture:[],other:[]};
  if(S.passport) BASIC_Q.forEach(q=>pool.basic.push(QMAP[q.id]));
  SITES.filter(s=>card(s.id).rank>0).forEach(s=>siteQuestions(s).forEach(q=>pool[q.cat].push(q)));
  return pool;
}
function buildMock(){
  const pool=mockPool(), cats=Object.keys(pool).filter(k=>pool[k].length);
  const total=Math.min(60, cats.reduce((a,k)=>a+pool[k].length,0));
  const wsum=cats.reduce((a,k)=>a+CAT_RATIO[k],0);
  let picks=[];
  cats.forEach(k=>{const n=Math.min(pool[k].length,Math.round(total*CAT_RATIO[k]/wsum)); picks=picks.concat(shuffle(pool[k]).slice(0,n));});
  if(picks.length<total){const rest=shuffle(cats.flatMap(k=>pool[k]).filter(q=>!picks.includes(q))); picks=picks.concat(rest.slice(0,total-picks.length));}
  return shuffle(picks.slice(0,total));
}

}
function MockResult(m,r,back){
  const score=Math.round(r.correct/r.total*100), pass=score>=60;
  S.mocks.push({d:today(),n:r.total,s:score}); save();
  m.appendChild(h(`<div class="card center"><div class="small">100点満点に換算</div><div class="score" style="color:${pass?"var(--green)":"var(--red)"}">${score}<span style="font-size:22px">点</span></div><div style="margin-top:8px;font-weight:700">${pass?"合格ライン（60点）クリア！":"合格ラインまであと"+(60-score)+"点"}</div><div class="small">${r.correct} / ${r.total} 問正解</div></div>`));
  const byCat={}; r.answers.forEach(a=>{const k=a.q.cat; byCat[k]=byCat[k]||[0,0]; byCat[k][1]++; if(a.ok)byCat[k][0]++;});
  const c=h(`<div class="card"><b>分野別</b><table class="res" style="margin-top:6px"></table></div>`);
  Object.keys(CAT_NAME).filter(k=>byCat[k]).forEach(k=>c.querySelector("table").appendChild(h(`<tr><td>${CAT_NAME[k]}</td><td>${byCat[k][0]} / ${byCat[k][1]}</td></tr>`)));
  m.appendChild(c);
  const wrong=r.answers.filter(a=>!a.ok);
  if(wrong.length){
    const w=h(`<div class="card"><b>まちがえた問題（苦手リストに入ったよ）</b></div>`);
    wrong.forEach(a=>w.appendChild(h(`<div style="margin-top:10px;font-size:14px;line-height:1.6"><div>${ty(a.q.q)}</div><div style="color:var(--green);font-weight:700">答え：${ty(a.q.c[0])}</div><div class="small">${ty(a.q.e)}</div></div>`)));
    m.appendChild(w);
  }
  const b=h(`<button class="btn">もどる</button>`); b.onclick=back; m.appendChild(b);
}

// ===== パスポート =====
function Passport(){
  const m=screen("パスポート");
  m.appendChild(h(`<div class="pp-cover"><div class="t1">WORLD HERITAGE</div><div style="color:var(--gold);margin:12px 0">${icon("globe",64)}</div><div class="t2">世界遺産トラベラー</div><div class="t1">PASSPORT</div></div>`));
  const info=h(`<div class="pp-page"><div class="small">所持者</div><input type="text" placeholder="なまえを入れてね" value="${esc(S.name||"")}"><div class="small" style="margin-top:10px">発行日：${S.passport?S.passport.replace(/-/g,"/"):"まだ発行されていません"}</div></div>`);
  info.querySelector("input").onchange=e=>{S.name=e.target.value;save();};
  m.appendChild(info);
  const st=h(`<div class="pp-page"><b style="font-family:var(--serif)">ビザ・入国スタンプ</b><div class="stampgrid"></div></div>`), g=st.querySelector(".stampgrid");
  g.appendChild(h(S.passport?`<div class="stamp blue"><div><b>本部</b>PARIS<br>${S.passport.replace(/-/g,".")}</div></div>`:`<div class="stamp empty"><div>本部</div></div>`));
  AREAS.forEach(([a,name],i)=>g.appendChild(h(S.stamps[a]?`<div class="stamp ${["red","green","blue"][i%3]}"><div><b style="font-size:12px">${name}</b>${S.stamps[a].replace(/-/g,".")}</div></div>`:`<div class="stamp empty"><div>${name}</div></div>`)));
  m.appendChild(st);
  const set=h(`<div class="pp-page"><b style="font-family:var(--serif)">設定</b>
    <div class="small" style="margin-top:10px">本番の日</div><input type="date" value="${S.examDate}">
    <label class="row" style="margin-top:12px;font-size:14px"><input type="checkbox" ${S.sound?"checked":""} style="width:20px;height:20px"> 効果音を鳴らす</label>
    <div class="small" style="margin-top:14px">データのバックアップ（機種変更や消えたときのため）</div>
    <div class="row"><button class="btn ghost" id="ex">書き出す</button><button class="btn ghost" id="im">読み込む</button></div>
    <input type="file" accept="application/json,.json" style="display:none">
    <button class="btn ghost" id="rs" style="border-color:var(--red);color:var(--red);margin-top:18px">最初からやり直す</button></div>`);
  set.querySelector("input[type=date]").onchange=e=>{if(e.target.value){S.examDate=e.target.value;save();toast("本番の日を変更しました");}};
  set.querySelector("input[type=checkbox]").onchange=e=>{S.sound=e.target.checked;save();};
  set.querySelector("#ex").onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=`isan-traveler-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  };
  const file=set.querySelector("input[type=file]");
  set.querySelector("#im").onclick=()=>file.click();
  file.onchange=()=>{const f=file.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{try{const d=JSON.parse(rd.result); if(!d||d.v!==1) throw 0; S=Object.assign(blank(),d); save(); toast("読み込みました"); Passport();}catch(e){toast("読み込めないファイルです");}}; rd.readAsText(f);};
  set.querySelector("#rs").onclick=()=>ask("すべての記録を消して最初からやり直しますか？",()=>{S=blank();save();TAB="home";go();},"消す");
  m.appendChild(set);
}

go();

</script>
